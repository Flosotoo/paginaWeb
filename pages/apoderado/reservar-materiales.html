<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Reservar materiales</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/buttons.css" />
    <link rel="stylesheet" href="../../assets/css/forms.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main id="contenido-principal" class="ce-principal">
      <section class="ce-contenedor">
        <h1 class="ce-titulo-pagina">Reservar materiales</h1>
        <p class="ce-bajada">
          Selecciona un pupilo, busca los materiales disponibles y prepara una
          reserva para retirar en la librería.
        </p>
        <form class="ce-tarjeta" id="formReserva" action="#" method="post">
          <div class="ce-campos-par">
            <div class="ce-campo">
              <label for="hijoReserva"
                >Pupilo
                <span class="ce-obligatorio" aria-hidden="true">*</span></label
              >
              <select
                id="hijoReserva"
                name="hijoReserva"
                class="ce-control"
                required
              >
                <option value="">Selecciona un pupilo</option>
                <option value="martin">Martín Pérez, 7° Básico</option>
                <option value="sofia">Sofía Pérez, 3° Básico</option>
              </select>
            </div>
            <div class="ce-campo">
              <label for="cantidad"
                >Cantidad
                <span class="ce-obligatorio" aria-hidden="true">*</span></label
              >
              <input
                id="cantidad"
                name="cantidad"
                class="ce-control"
                type="number"
                min="1"
                value="1"
                required
              />
            </div>
          </div>
          <label for="busquedaReserva">Buscar material</label>
          <input
            id="busquedaReserva"
            class="ce-control"
            type="search"
            placeholder="Nombre, código o descripción"
          />
          <label for="ordenReserva">Ordenar resultados</label>
          <select id="ordenReserva" class="ce-control">
            <option value="nombre-asc">Nombre A-Z</option>
            <option value="nombre-desc">Nombre Z-A</option>
            <option value="precio-asc">Precio menor</option>
            <option value="precio-desc">Precio mayor</option>
          </select>
          <div class="ce-acciones">
            <button
              class="btn-ce btn-ce--secundario"
              type="button"
              id="limpiarReserva"
            >
              Limpiar filtros
            </button>
          </div>
        </form>
        <p id="resultadoReserva" aria-live="polite"></p>
        <div id="listaReserva" class="ce-grilla"></div>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/filtros.js"></script>
    <script>
      const reserva = window.filtros.crear(
        "edusaldo-filtros-reservas",
        (items) => {
          document.getElementById("resultadoReserva").textContent =
            `${items.length} material(es) encontrado(s)`;
          document.getElementById("listaReserva").innerHTML =
            items
              .map(
                (producto) => `
          <article class="ce-tarjeta">
            <img src="${producto.imagen}" alt="${producto.nombre}" width="240" height="120" />
            <h2 class="ce-subtitulo">${producto.nombre}</h2>
            <p>${producto.descripcion}</p>
            <p><strong>$${producto.precio.toLocaleString("es-CL")}</strong> · ${producto.stock ? `${producto.stock} disponibles` : "Agotado"}</p>
            <button class="btn-ce btn-ce--primario" type="button" ${producto.stock ? "" : "disabled"}>Añadir a la reserva</button>
          </article>
        `,
              )
              .join("") ||
            "<p>No hay materiales que coincidan con la búsqueda.</p>";
        },
      );
      document
        .getElementById("busquedaReserva")
        .addEventListener("input", (evento) => {
          reserva.estado.texto = evento.target.value;
          reserva.aplicar();
        });
      document
        .getElementById("ordenReserva")
        .addEventListener("change", (evento) => {
          reserva.estado.orden = evento.target.value;
          reserva.aplicar();
        });
      document
        .getElementById("limpiarReserva")
        .addEventListener("click", () => {
          reserva.limpiar();
          document.getElementById("busquedaReserva").value = "";
        });
      reserva.aplicar();
    </script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
