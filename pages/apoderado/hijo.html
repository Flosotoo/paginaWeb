<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cuenta de estudiante · EduSaldo</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body data-root="../../" data-role="apoderado">
    <header class="site-header">
      <div class="header-inner">
        <a href="inicio.html" class="brand brand-light"
          ><span class="brand-mark">e<span>·</span></span
          ><span>edu<strong>saldo</strong><i>.</i></span></a
        ><button
          class="mobile-nav-toggle"
          type="button"
          aria-label="Abrir menú"
          aria-expanded="false"
          aria-controls="mobile-main-nav"
        >
          <span aria-hidden="true">☰</span
          ><span class="mobile-nav-label">Menú</span>
        </button>
        <nav
          id="mobile-main-nav"
          class="header-nav"
          aria-label="Navegación principal"
        >
          <a class="active" href="inicio.html">Mis alumnos</a
          ><a href="mi-cuenta.html">Mi cuenta</a>
        </nav>
        <div class="header-account">
          <span class="user-bubble" data-initial></span
          ><span class="user-name" data-user></span
          ><button class="logout" id="logout" type="button">Salir ↗</button>
        </div>
      </div>
    </header>
    <main class="dashboard detail-dashboard">
      <a class="back-link" href="inicio.html">← Cambiar alumno</a>
      <section class="detail-hero detail-hero-compact">
        <span class="eyebrow">ALUMNO SELECCIONADO</span>
        <div class="detail-person">
          <span class="detail-avatar" id="detail-avatar"></span>
          <div>
            <h1 id="detail-name"></h1>
            <p id="detail-course"></p>
          </div>
        </div>
        <div class="detail-balance">
          <span>Saldo disponible</span><strong id="detail-balance"></strong>
        </div>
      </section>
      <section class="detail-options detail-options-simple">
        <h2>¿Qué quieres hacer?</h2>
        <div id="detail-actions" class="detail-actions"></div>
      </section>
      <p class="footer-note">
        Datos ficticios de demostración académica. El aporte utiliza Webpay
        simulado; las reservas son simuladas y quedan pendientes de entrega.
      </p>
    </main>
    <script src="../../assets/js/navigation.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script src="../../assets/js/cierre-funcional.js"></script>
  </body>
</html>
