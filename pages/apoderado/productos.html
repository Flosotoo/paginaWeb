<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Productos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/buttons.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main id="contenido-principal" class="ce-principal">
      <section class="ce-contenedor">
        <h1 class="ce-titulo-pagina">Catálogo de productos</h1>
        <p class="ce-bajada">
          Materiales disponibles para apoderados autenticados.
        </p>
        <form id="formFiltros" class="ce-tarjeta">
          <label for="busqueda">Buscar por nombre, código o descripción</label
          ><input id="busqueda" type="search" /><label for="orden"
            >Ordenar</label
          ><select id="orden">
            <option value="nombre-asc">Nombre A-Z</option>
            <option value="nombre-desc">Nombre Z-A</option>
            <option value="precio-asc">Precio menor</option>
            <option value="precio-desc">Precio mayor</option></select
          ><label
            ><input id="disponibles" type="checkbox" /> Solo disponibles</label
          ><button class="btn-ce btn-ce--secundario" id="limpiar" type="button">
            Limpiar filtros
          </button>
        </form>
        <p id="resultado" aria-live="polite"></p>
        <div id="lista-productos" class="ce-grilla"></div>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/filtros.js"></script>
    <script>
      const vista = window.filtros.crear(
        "edusaldo-filtros-productos",
        (items) => {
          document.getElementById("resultado").textContent =
            `${items.length} producto(s) encontrado(s)`;
          document.getElementById("lista-productos").innerHTML =
            items
              .map(
                (p) =>
                  `<article class="ce-tarjeta"><img src="${p.imagen}" alt="${p.nombre}" width="240" height="120"><h2 class="ce-subtitulo">${p.nombre}</h2><p>${p.descripcion}</p><p><strong>$${p.precio.toLocaleString("es-CL")}</strong></p><a class="btn-ce btn-ce--primario" href="producto-detalle.html?id=${p.id}">Ver detalle</a></article>`,
              )
              .join("") || "<p>No hay productos con esos filtros.</p>";
        },
      );
      document.getElementById("busqueda").addEventListener("input", (e) => {
        vista.estado.texto = e.target.value;
        vista.aplicar();
      });
      document.getElementById("orden").addEventListener("change", (e) => {
        vista.estado.orden = e.target.value;
        vista.aplicar();
      });
      document.getElementById("disponibles").addEventListener("change", (e) => {
        vista.estado.disponibles = e.target.checked;
        vista.aplicar();
      });
      document.getElementById("limpiar").addEventListener("click", () => {
        vista.limpiar();
        document.getElementById("busqueda").value = "";
        document.getElementById("disponibles").checked = false;
      });
      vista.aplicar();
    </script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
