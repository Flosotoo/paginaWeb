<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Perfil</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/buttons.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main id="contenido-principal" class="ce-principal">
      <section class="ce-contenedor">
        <h1 class="ce-titulo-pagina">Mi perfil</h1>
        <form class="ce-tarjeta" action="#" method="post">
          <label for="nombre">Nombre completo</label
          ><input id="nombre" value="Camila Pérez" maxlength="100" /><label
            for="correo"
            >Correo</label
          ><input
            id="correo"
            type="email"
            value="camila@example.com"
            maxlength="100"
          /><label for="direccion">Dirección</label
          ><textarea id="direccion" maxlength="300">Av. Educación 123</textarea
          ><button class="btn-ce btn-ce--primario" type="submit">
            Solicitar rectificación
          </button>
        </form>
        <article class="ce-tarjeta">
          <h2 class="ce-subtitulo">Mis datos personales</h2>
          <p>Puedes solicitar una copia legible de tus datos registrados.</p>
          <button class="btn-ce btn-ce--secundario" type="button">
            Solicitar acceso a mis datos</button
          ><button class="btn-ce btn-ce--secundario" type="button">
            Revocar consentimiento
          </button>
        </article>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
