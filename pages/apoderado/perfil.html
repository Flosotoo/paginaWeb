<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Perfil</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div id="header-container" class="sticky-top"></div>
    <main id="contenido-principal" class="flex-grow-1 pt-5 pb-5">
      <section class="container">
        <h1 class="h1 mb-3">Mi perfil</h1>
        <p
          id="perfil-aviso"
          class="alert"
          role="status"
          aria-live="polite"
          hidden
        ></p>

        <!-- HU08: rectificación de datos personales -->
        <form class="card card-body mb-4" id="formPerfil" action="#" method="post">
          <h2 class="h3 mb-2">Rectificar mis datos</h2>
          <div class="mb-3">
            <label for="perfil-nombre" class="form-label">Nombre completo</label>
            <input
              id="perfil-nombre"
              name="nombre"
              class="form-control"
              value="Camila Pérez"
              maxlength="100"
              required
            />
            <span class="invalid-feedback" id="error-perfil-nombre" role="alert"></span>
          </div>
          <div class="mb-3">
            <label for="perfil-correo" class="form-label">Correo</label>
            <input
              id="perfil-correo"
              name="correo"
              type="email"
              class="form-control"
              value="camila@correo.cl"
              maxlength="100"
              required
            />
            <span class="invalid-feedback" id="error-perfil-correo" role="alert"></span>
          </div>
          <div class="mb-3">
            <label for="perfil-direccion" class="form-label">Dirección</label>
            <textarea
              id="perfil-direccion"
              name="direccion"
              class="form-control"
              maxlength="300"
              required
            >Av. Educación 123</textarea>
            <span class="invalid-feedback" id="error-perfil-direccion" role="alert"></span>
          </div>
          <div class="d-flex flex-wrap gap-2 mt-4">
            <button class="btn btn-primary" type="submit">
              Solicitar rectificación
            </button>
          </div>
        </form>

        <!-- HU07: acceso a los datos personales -->
        <article class="card card-body mb-4">
          <h2 class="h3 mb-2">Mis datos personales</h2>
          <p>Puedes descargar una copia legible de tus datos registrados.</p>
          <div class="d-flex flex-wrap align-items-center gap-3 mt-4">
            <button
              class="btn btn-outline-primary"
              type="button"
              id="btn-descargar-datos"
            >
              Solicitar acceso a mis datos
            </button>
          </div>
        </article>

        <!-- HU06: consentimiento de datos y su revocación -->
        <article class="card card-body mb-4">
          <h2 class="h3 mb-2">Consentimiento de datos</h2>
          <p id="consentimiento-estado"></p>
          <p>
            Al revocar el consentimiento, tus datos y los de tus alumnos se
            anonimizan en un plazo no mayor a 30 días.
          </p>
          <div class="d-flex flex-wrap align-items-center gap-3 mt-4">
            <button
              class="btn btn-outline-danger"
              type="button"
              id="btn-revocar-consentimiento"
            >
              Revocar consentimiento
            </button>
          </div>
        </article>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="../../assets/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
    <script src="../../assets/js/validaciones.js"></script>
    <script src="../../assets/js/perfil.js"></script>
  </body>
</html>
