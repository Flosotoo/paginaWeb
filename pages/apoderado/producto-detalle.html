<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Detalle de producto</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/buttons.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main id="contenido-principal" class="ce-principal">
      <section class="ce-contenedor">
        <h1 class="ce-titulo-pagina">Detalle del producto</h1>
        <article class="ce-tarjeta">
          <img
            src="../../assets/img/landing-page.jpg"
            alt="Material escolar"
            width="480"
            height="240"
          />
          <h2 class="ce-subtitulo">Cuaderno universitario</h2>
          <p>Cuaderno cuadriculado para uso diario y actividades escolares.</p>
          <p><strong>$3.490</strong></p>
          <label for="cantidad">Cantidad</label
          ><input id="cantidad" type="number" min="1" value="1" /><button
            class="btn-ce btn-ce--primario"
            type="button"
          >
            Agregar al carrito</button
          ><a class="btn-ce btn-ce--secundario" href="productos.html"
            >Volver al catálogo</a
          >
        </article>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
