<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Detalle de producto</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/buttons.css" />
    <link rel="stylesheet" href="../../assets/css/forms.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main id="contenido-principal" class="ce-principal">
      <section class="ce-contenedor">
        <h1 class="ce-titulo-pagina">Detalle del producto</h1>

        <!-- HU18: el detalle se carga desde el catálogo por codigo -->
        <article class="ce-tarjeta">
          <img
            id="detalle-imagen"
            src="../../assets/img/landing-page.jpg"
            alt="Material escolar"
            width="480"
            height="240"
          />
          <h2 class="ce-subtitulo" id="detalle-nombre">Producto</h2>
          <p id="detalle-descripcion"></p>
          <p><strong id="detalle-precio"></strong></p>
          <p id="detalle-stock"></p>
          <div class="ce-campo">
            <label for="cantidad">Cantidad</label>
            <input
              id="cantidad"
              name="cantidad"
              class="ce-control ce-control--dato"
              type="number"
              min="1"
              step="1"
              value="1"
            />
          </div>
          <div class="ce-acciones">
            <button
              class="btn-ce btn-ce--primario"
              type="button"
              id="btn-carrito"
            >
              Agregar al carrito
            </button>
            <a class="btn-ce btn-ce--secundario" href="productos.html"
              >Volver al catálogo</a
            >
          </div>
          <p id="detalle-aviso" class="ce-aviso ce-aviso--error" hidden></p>
        </article>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="../../assets/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      (function () {
        const codigo = new URLSearchParams(window.location.search).get("codigo");
        const producto = window.Datos ? window.Datos.buscarProducto(codigo) : null;
        const aviso = document.getElementById("detalle-aviso");
        const boton = document.getElementById("btn-carrito");

        if (producto) {
          document.getElementById("detalle-imagen").src = producto.imagen;
          document.getElementById("detalle-imagen").alt = producto.nombre;
          document.getElementById("detalle-nombre").textContent = producto.nombre;
          document.getElementById("detalle-descripcion").textContent =
            producto.descripcion;
          document.getElementById("detalle-precio").textContent = `$${producto.precio.toLocaleString("es-CL")}`;
          document.getElementById("detalle-stock").textContent =
            producto.stock > 0
              ? `${producto.stock} unidades disponibles`
              : "Producto agotado";
          boton.disabled = producto.stock === 0;
        } else {
          aviso.textContent = "No encontramos ese producto. Vuelve al catálogo.";
          aviso.hidden = false;
          boton.disabled = true;
        }

        boton.addEventListener("click", () => {
          aviso.className = "ce-aviso ce-aviso--info";
          aviso.textContent =
            "El carrito se implementa en la Evaluación 2 (TypeScript).";
          aviso.hidden = false;
        });
      })();
    </script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
