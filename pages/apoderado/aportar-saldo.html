<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Aportar saldo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div id="header-container" class="sticky-top"></div>
    <main id="contenido-principal" class="flex-grow-1 pt-5 pb-5">
      <section class="container">
        <h1 class="h1 mb-3">Aportar saldo</h1>
        <p class="lead mb-4">
          Selecciona uno de tus pupilos e ingresa el monto que deseas aportar.
        </p>
        <div class="row justify-content-center">
          <div class="col-md-8 col-lg-5">
          <form
            class="card card-body"
            id="formAporte"
            action="#"
            method="post"
          >
            <div class="mb-3">
              <label for="hijo" class="form-label"
                >Pupilo
                <span class="text-danger" aria-hidden="true">*</span></label
              >
              <select id="hijo" name="hijo" class="form-select" required>
                <option value="">Selecciona un pupilo</option>
                <option value="martin">Martín Pérez, 7° Básico</option>
                <option value="sofia">Sofía Pérez, 3° Básico</option>
              </select>
              <span class="invalid-feedback" id="error-hijo" role="alert"></span>
            </div>
            <div class="mb-3">
              <label for="monto" class="form-label"
                >Monto del aporte
                <span class="text-danger" aria-hidden="true">*</span></label
              >
              <input
                id="monto"
                name="monto"
                class="form-control"
                type="number"
                min="1"
                step="1"
                required
              />
              <span class="form-text"
                >Ingresa un monto entero mayor que cero.</span
              >
              <span class="invalid-feedback" id="error-monto" role="alert"></span>
            </div>
            <p
              id="aporte-aviso"
              class="alert alert-info"
              role="status"
              aria-live="polite"
              hidden
            ></p>
            <div class="d-flex flex-wrap gap-2 mt-4">
              <button class="btn btn-primary" type="submit">
                Continuar a Webpay
              </button>
              <a class="btn btn-outline-primary" href="mis-hijos.html"
                >Cancelar</a
              >
            </div>
          </form>
          </div>
        </div>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="../../assets/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/validaciones.js"></script>
    <script src="../../assets/js/apoderado.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
