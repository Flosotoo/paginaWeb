<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Aportar saldo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/buttons.css" />
    <link rel="stylesheet" href="../../assets/css/forms.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main id="contenido-principal" class="ce-principal">
      <section class="ce-contenedor">
        <h1 class="ce-titulo-pagina">Aportar saldo</h1>
        <p class="ce-bajada">
          Selecciona uno de tus pupilos e ingresa el monto que deseas aportar.
        </p>
        <form
          class="ce-panel"
          id="formAporte"
          action="#"
          method="post"
        >
          <div class="ce-campo">
            <label for="hijo"
              >Pupilo
              <span class="ce-obligatorio" aria-hidden="true">*</span></label
            >
            <select id="hijo" name="hijo" class="ce-control" required>
              <option value="">Selecciona un pupilo</option>
              <option value="martin">Martín Pérez, 7° Básico</option>
              <option value="sofia">Sofía Pérez, 3° Básico</option>
            </select>
            <span class="ce-error" id="error-hijo" role="alert"></span>
          </div>
          <div class="ce-campo">
            <label for="monto"
              >Monto del aporte
              <span class="ce-obligatorio" aria-hidden="true">*</span></label
            >
            <input
              id="monto"
              name="monto"
              class="ce-control"
              type="number"
              min="1"
              step="1"
              required
            />
            <span class="ce-ayuda"
              >Ingresa un monto entero mayor que cero.</span
            >
            <span class="ce-error" id="error-monto" role="alert"></span>
          </div>
          <p
            id="aporte-aviso"
            class="ce-aviso ce-aviso--info"
            role="status"
            aria-live="polite"
            hidden
          ></p>
          <div class="ce-formulario__acciones">
            <button class="btn-ce btn-ce--primario" type="submit">
              Continuar a Webpay
            </button>
            <a class="btn-ce btn-ce--secundario" href="mis-hijos.html"
              >Cancelar</a
            >
          </div>
        </form>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/validaciones.js"></script>
    <script src="../../assets/js/apoderado.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
