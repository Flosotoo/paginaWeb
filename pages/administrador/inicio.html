<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Inicio administrador</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div id="header-container" class="sticky-top"></div>
    <main id="contenido-principal" class="flex-grow-1 pt-5 pb-5">
      <section class="container">
        <h1 class="h1 mb-3">Panel administrativo</h1>
        <p class="lead mb-4">
          Administra usuarios, estudiantes, productos y alertas de reposición.
        </p>
        <p id="admin-nombre" class="badge rounded-pill"></p>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
          <div class="col">
<article class="card card-body h-100">
            <h2 class="h3 mb-2">Productos</h2>
            <a class="btn btn-primary mt-auto" href="productos.html"
              >Gestionar productos</a
            >
          </article>
</div>
          <div class="col">
<article class="card card-body h-100">
            <h2 class="h3 mb-2">Usuarios</h2>
            <a class="btn btn-primary mt-auto" href="usuarios.html"
              >Gestionar usuarios</a
            >
          </article>
</div>
          <div class="col">
<article class="card card-body h-100">
            <h2 class="h3 mb-2">Estudiantes</h2>
            <a class="btn btn-primary mt-auto" href="estudiantes.html"
              >Gestionar estudiantes</a
            >
          </article>
</div>
          <div class="col">
<article class="card card-body h-100">
            <h2 class="h3 mb-2">Importar nómina</h2>
            <a class="btn btn-primary mt-auto" href="../libreria/nomina-import.html"
              >Importar nómina</a
            >
          </article>
</div>
          <div class="col">
<article class="card card-body h-100">
            <h2 class="h3 mb-2">Stock crítico</h2>
            <!-- HU54: alerta de reposición desde el catálogo -->
            <div id="alerta-stock"></div>
          </article>
</div>
        </div>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="../../assets/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/validaciones.js"></script>
    <script src="../../assets/js/producto.js"></script>
    <script>
      (function () {
        const sesion = window.Sesion ? Sesion.actual() : null;
        const saludo = document.getElementById("admin-nombre");
        if (sesion && saludo) saludo.textContent = `Administrador: ${sesion.nombre}`;
      })();
    </script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
