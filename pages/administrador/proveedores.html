<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Maestro de Proveedores · EduSaldo</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body data-root="../../" data-role="administrador">
    <header class="site-header">
      <div class="header-inner">
        <a href="inicio.html" class="brand brand-light"
          ><span class="brand-mark">e<span>·</span></span
          ><span>edu<strong>saldo</strong><i>.</i></span></a
        ><button
          class="mobile-nav-toggle"
          type="button"
          aria-label="Abrir menú"
          aria-expanded="false"
          aria-controls="mobile-main-nav"
        >
          <span aria-hidden="true">☰</span
          ><span class="mobile-nav-label">Menú</span>
        </button>
        <nav
          id="mobile-main-nav"
          class="header-nav"
          aria-label="Módulo administrador"
        >
          <a href="inicio.html">Inicio</a
          ><a href="finanzas.html">Cuenta Librería</a
          ><a href="inventario-admin.html">Inventario</a
          ><a class="active" href="compras.html">Gestión de Compras</a
          ><a href="pagos.html">Pagos</a
          ><a href="configuracion.html">Configuración</a>
        </nav>
        <div class="header-account">
          <span class="user-bubble" data-initial></span
          ><span class="user-name" data-user></span
          ><button class="logout" id="logout" type="button">Salir ↗</button>
        </div>
      </div>
    </header>
    <main class="dashboard admin-dashboard">
      <header class="top">
        <span class="logo">EduSaldo · Administrador</span>
        <div class="avatar" data-initial></div>
      </header>
      <span class="eyebrow">GESTIÓN DE COMPRAS</span>
      <h1>Maestro de Proveedores</h1>
      <a class="back-link" href="compras.html">← Volver a Gestión de Compras</a>
      <section id="proveedores" class="card">
        <h2>Maestro de Proveedores</h2>
        <p class="muted">
          Los proveedores nuevos quedan disponibles automáticamente para futuras
          órdenes de compra.
        </p>
        <form id="supplier-form">
          <div class="form-grid">
            <div class="field">
              <label>Razón Social</label
              ><input id="sup-name" class="input" required />
            </div>
            <div class="field">
              <label>RUT</label><input id="sup-rut" class="input" required />
            </div>
            <div class="field">
              <label>Teléfono</label><input id="sup-phone" class="input" />
            </div>
            <div class="field">
              <label>Email</label
              ><input id="sup-email" class="input" type="email" />
            </div>
            <div class="field wide">
              <label>Dirección</label><input id="sup-address" class="input" />
            </div>
            <div class="field">
              <label>Contacto</label><input id="sup-contact" class="input" />
            </div>
            <div class="field">
              <label>Banco</label><input id="sup-bank" class="input" />
            </div>
            <div class="field">
              <label>Tipo de cuenta</label
              ><input id="sup-account-type" class="input" />
            </div>
            <div class="field">
              <label>N.º cuenta</label><input id="sup-account" class="input" />
            </div>
            <div class="field">
              <label>Titular cuenta</label
              ><input id="sup-holder" class="input" />
            </div>
          </div>
          <p id="supplier-feedback" class="form-feedback"></p>
          <button class="btn" type="submit">Guardar proveedor</button>
        </form>
        <div id="supplier-list" style="margin-top: 20px"></div>
      </section>
    </main>
    <script src="../../assets/js/navigation.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script src="../../assets/js/compras.js"></script>
    <script src="../../assets/js/cierre-funcional.js"></script>
  </body>
</html>
