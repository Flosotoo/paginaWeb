<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Usuarios</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/buttons.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main id="contenido-principal" class="ce-principal">
      <section class="ce-contenedor">
        <h1 class="ce-titulo-pagina">Usuarios</h1>
        <a class="btn-ce btn-ce--primario" href="#form-usuario"
          >Crear usuario</a
        >
        <div class="ce-tarjeta">
          <h2 class="ce-subtitulo">Camila Pérez</h2>
          <p>camila@example.com · Perfil: Cliente · Estado: Activo</p>
        </div>
        <form class="ce-tarjeta" id="form-usuario" action="#" method="post">
          <h2 class="ce-subtitulo">Nuevo usuario</h2>
          <label for="run">RUN</label><input id="run" required /><label
            for="correo"
            >Correo</label
          ><input id="correo" type="email" required /><label for="perfil"
            >Perfil</label
          ><select id="perfil" required>
            <option value="">Selecciona un perfil</option>
            <option>Administrador</option>
            <option>Cliente</option>
            <option>Vendedor</option></select
          ><button class="btn-ce btn-ce--primario" type="submit">
            Guardar usuario
          </button>
        </form>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
