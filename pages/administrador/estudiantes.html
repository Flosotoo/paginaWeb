<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Estudiantes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div id="header-container" class="sticky-top"></div>
    <main id="contenido-principal" class="flex-grow-1 pt-5 pb-5">
      <section class="container">
        <h1 class="h1 mb-3">Estudiantes</h1>
        <!-- HU49: registrar estudiante -->
        <div class="row justify-content-center">
          <div class="col-lg-7">
          <form
            class="card card-body mb-4"
            id="formEstudiante"
            action="#"
            method="post"
          >
            <h2 class="h3 mb-2">Registrar estudiante</h2>
            <p
              id="estudiante-aviso"
              class="alert"
              role="status"
              aria-live="polite"
              hidden
            ></p>
            <div class="row g-3 mb-3">
              <div class="col-sm-6">
                <label for="nombre" class="form-label"
                  >Nombre
                  <span class="text-danger" aria-hidden="true">*</span></label
                >
                <input id="nombre" name="nombre" class="form-control" required />
              </div>
              <div class="col-sm-6">
                <label for="apellido" class="form-label"
                  >Apellido
                  <span class="text-danger" aria-hidden="true">*</span></label
                >
                <input id="apellido" name="apellido" class="form-control" required />
              </div>
            </div>
            <div class="mb-3">
              <label for="curso" class="form-label"
                >Curso
                <span class="text-danger" aria-hidden="true">*</span></label
              >
              <input id="curso" name="curso" class="form-control" required />
            </div>
            <div class="d-flex flex-wrap gap-2 mt-4">
              <button class="btn btn-primary" type="submit">
                Registrar estudiante
              </button>
            </div>
          </form>
          </div>
        </div>

        <!-- HU50: asociar estudiante a un apoderado -->
        <form
          class="card card-body mb-4"
          id="formAsociacion"
          action="#"
          method="post"
        >
          <h2 class="h3 mb-2">Asociar a un apoderado</h2>
          <p
            id="asociacion-aviso"
            class="alert"
            role="status"
            aria-live="polite"
            hidden
          ></p>
          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label for="asociar-estudiante" class="form-label"
                >Estudiante
                <span class="text-danger" aria-hidden="true">*</span></label
              >
              <select
                id="asociar-estudiante"
                name="estudiante"
                class="form-select"
                required
              >
                <option value="">Selecciona un estudiante</option>
              </select>
            </div>
            <div class="col-sm-6">
              <label for="asociar-apoderado" class="form-label"
                >Apoderado
                <span class="text-danger" aria-hidden="true">*</span></label
              >
              <select
                id="asociar-apoderado"
                name="apoderado"
                class="form-select"
                required
              >
                <option value="">Selecciona un apoderado</option>
              </select>
            </div>
          </div>
          <div class="d-flex flex-wrap gap-2 mt-4">
            <button class="btn btn-primary" type="submit">
              Asociar estudiante
            </button>
          </div>
        </form>

        <div id="lista-estudiantes"></div>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="../../assets/js/app.js"></script>
    <script src="../../assets/js/buscador.js"></script>
    <script src="../../assets/js/logs.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/validaciones.js"></script>
    <script src="../../assets/js/estudiante.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
