<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Estudiantes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/buttons.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main id="contenido-principal" class="ce-principal">
      <section class="ce-contenedor">
        <h1 class="ce-titulo-pagina">Estudiantes</h1>
        <form class="ce-tarjeta" action="#" method="post">
          <label for="nombre">Nombre</label><input id="nombre" required /><label
            for="apellido"
            >Apellido</label
          ><input id="apellido" required /><label for="curso">Curso</label
          ><input id="curso" required /><button
            class="btn-ce btn-ce--primario"
            type="submit"
          >
            Registrar estudiante
          </button>
        </form>
        <article class="ce-tarjeta">
          <h2 class="ce-subtitulo">Martín Pérez</h2>
          <p>7° Básico · Apoderado: Camila Pérez · Asociado</p>
        </article>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
