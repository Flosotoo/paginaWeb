<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Editar producto</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/buttons.css" />
    <link rel="stylesheet" href="../../assets/css/forms.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main id="contenido-principal" class="ce-principal">
      <section class="ce-contenedor">
        <h1 class="ce-titulo-pagina">Editar producto</h1>
        <p
          id="producto-aviso"
          class="ce-aviso"
          role="status"
          aria-live="polite"
          hidden
        ></p>
        <!-- HU28 (crear, si el código está editable) y HU29 (editar, código en solo lectura) -->
        <form
          class="ce-panel ce-panel--ancho"
          id="formProducto"
          action="#"
          method="post"
        >
          <div class="ce-campo">
            <label for="codigo"
              >Código
              <span class="ce-obligatorio" aria-hidden="true">*</span></label
            >
            <input
              id="codigo"
              name="codigo"
              class="ce-control ce-control--dato"
              value="MAT-001"
              minlength="3"
              maxlength="20"
              required
              readonly
            />
            <span class="ce-ayuda">Al menos 3 caracteres. No se modifica.</span>
            <span class="ce-error" id="error-codigo" role="alert"></span>
          </div>

          <div class="ce-campo">
            <label for="nombre"
              >Nombre
              <span class="ce-obligatorio" aria-hidden="true">*</span></label
            >
            <input
              id="nombre"
              name="nombre"
              class="ce-control"
              maxlength="100"
              value="Cuaderno universitario"
              required
            />
            <span class="ce-ayuda">Máximo 100 caracteres.</span>
            <span class="ce-error" id="error-nombre" role="alert"></span>
          </div>

          <div class="ce-campo">
            <label for="descripcion">Descripción</label>
            <textarea
              id="descripcion"
              name="descripcion"
              class="ce-control"
              rows="3"
              maxlength="500"
            ></textarea>
            <span class="ce-ayuda">Máximo 500 caracteres. Es opcional.</span>
            <span class="ce-error" id="error-descripcion" role="alert"></span>
          </div>

          <div class="ce-campos-par">
            <div class="ce-campo">
              <label for="precio"
                >Precio
                <span class="ce-obligatorio" aria-hidden="true">*</span></label
              >
              <input
                id="precio"
                name="precio"
                class="ce-control ce-control--dato"
                type="number"
                min="0"
                step="0.01"
                required
              />
              <span class="ce-ayuda">Mayor o igual a cero, admite decimales.</span>
              <span class="ce-error" id="error-precio" role="alert"></span>
            </div>

            <div class="ce-campo">
              <label for="categoria"
                >Categoría
                <span class="ce-obligatorio" aria-hidden="true">*</span></label
              >
              <select id="categoria" name="categoria" class="ce-control" required>
                <option value="">Selecciona una categoría</option>
                <option>Materiales</option>
                <option>Matemática</option>
                <option>Lenguaje</option>
                <option>Artes</option>
              </select>
              <span class="ce-error" id="error-categoria" role="alert"></span>
            </div>
          </div>

          <div class="ce-campos-par">
            <div class="ce-campo">
              <label for="stock"
                >Stock
                <span class="ce-obligatorio" aria-hidden="true">*</span></label
              >
              <input
                id="stock"
                name="stock"
                class="ce-control ce-control--dato"
                type="number"
                min="0"
                step="1"
                required
              />
              <span class="ce-ayuda">Entero mayor o igual a cero.</span>
              <span class="ce-error" id="error-stock" role="alert"></span>
            </div>

            <div class="ce-campo">
              <label for="stock-critico">Stock crítico</label>
              <input
                id="stock-critico"
                name="stock_critico"
                class="ce-control ce-control--dato"
                type="number"
                min="0"
                step="1"
              />
              <span class="ce-ayuda">Entero mayor o igual a cero. Opcional.</span>
              <span class="ce-error" id="error-stock-critico" role="alert"></span>
            </div>
          </div>

          <div class="ce-formulario__acciones">
            <button class="btn-ce btn-ce--primario" type="submit">
              Guardar producto
            </button>
            <a class="btn-ce btn-ce--secundario" href="productos.html"
              >Cancelar</a
            >
          </div>
        </form>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
    <script src="../../assets/js/validaciones.js"></script>
    <script src="../../assets/js/producto.js"></script>
  </body>
</html>
