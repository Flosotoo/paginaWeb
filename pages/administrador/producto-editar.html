<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Editar producto</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div id="header-container" class="sticky-top"></div>
    <main id="contenido-principal" class="flex-grow-1 pt-5 pb-5">
      <section class="container">
        <h1 class="h1 mb-3" id="titulo-producto">Editar producto</h1>
        <p
          id="producto-aviso"
          class="alert"
          role="status"
          aria-live="polite"
          hidden
        ></p>
        <!-- HU28 (crear, si el código está editable) y HU29 (editar, código en solo lectura) -->
        <div class="row justify-content-center">
          <div class="col-lg-7">
          <form
            class="card card-body"
            id="formProducto"
            action="#"
            method="post"
          >
            <div class="mb-3">
              <label for="codigo" class="form-label"
                >Código
                <span class="text-danger" aria-hidden="true">*</span></label
              >
              <input
                id="codigo"
                name="codigo"
                class="form-control font-monospace"
                value="MAT-001"
                minlength="3"
                maxlength="20"
                required
                readonly
              />
              <span class="form-text">Al menos 3 caracteres. No se modifica.</span>
              <span class="invalid-feedback" id="error-codigo" role="alert"></span>
            </div>
  
            <div class="mb-3">
              <label for="nombre" class="form-label"
                >Nombre
                <span class="text-danger" aria-hidden="true">*</span></label
              >
              <input
                id="nombre"
                name="nombre"
                class="form-control"
                maxlength="100"
                value="Cuaderno universitario"
                required
              />
              <span class="form-text">Máximo 100 caracteres.</span>
              <span class="invalid-feedback" id="error-nombre" role="alert"></span>
            </div>
  
            <div class="mb-3">
              <label for="descripcion" class="form-label">Descripción</label>
              <textarea
                id="descripcion"
                name="descripcion"
                class="form-control"
                rows="3"
                maxlength="500"
              ></textarea>
              <span class="form-text">Máximo 500 caracteres. Es opcional.</span>
              <span class="invalid-feedback" id="error-descripcion" role="alert"></span>
            </div>
  
            <div class="row g-3 mb-3">
              <div class="col-sm-6">
                <label for="precio" class="form-label"
                  >Precio
                  <span class="text-danger" aria-hidden="true">*</span></label
                >
                <input
                  id="precio"
                  name="precio"
                  class="form-control font-monospace"
                  type="number"
                  min="0"
                  step="0.01"
                  required
                />
                <span class="form-text">Mayor o igual a cero, admite decimales.</span>
                <span class="invalid-feedback" id="error-precio" role="alert"></span>
              </div>
  
              <div class="col-sm-6">
                <label for="categoria" class="form-label"
                  >Categoría
                  <span class="text-danger" aria-hidden="true">*</span></label
                >
                <select id="categoria" name="categoria" class="form-select" required>
                  <option value="">Selecciona una categoría</option>
                  <option>Materiales</option>
                  <option>Matemática</option>
                  <option>Lenguaje</option>
                  <option>Artes</option>
                </select>
                <span class="invalid-feedback" id="error-categoria" role="alert"></span>
              </div>
            </div>
  
            <div class="row g-3 mb-3">
              <div class="col-sm-6">
                <label for="stock" class="form-label"
                  >Stock
                  <span class="text-danger" aria-hidden="true">*</span></label
                >
                <input
                  id="stock"
                  name="stock"
                  class="form-control font-monospace"
                  type="number"
                  min="0"
                  step="1"
                  required
                />
                <span class="form-text">Entero mayor o igual a cero.</span>
                <span class="invalid-feedback" id="error-stock" role="alert"></span>
              </div>
  
              <div class="col-sm-6">
                <label for="stock-critico" class="form-label">Stock crítico</label>
                <input
                  id="stock-critico"
                  name="stock_critico"
                  class="form-control font-monospace"
                  type="number"
                  min="0"
                  step="1"
                />
                <span class="form-text">Entero mayor o igual a cero. Opcional.</span>
                <span class="invalid-feedback" id="error-stock-critico" role="alert"></span>
              </div>
            </div>
  
            <div class="d-flex flex-wrap gap-2 mt-4">
              <button class="btn btn-primary" type="submit">
                Guardar producto
              </button>
              <a class="btn btn-outline-primary" href="productos.html"
                >Cancelar</a
              >
            </div>
          </form>
          </div>
        </div>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="../../assets/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
    <script src="../../assets/js/validaciones.js"></script>
    <script src="../../assets/js/producto.js"></script>
  </body>
</html>
