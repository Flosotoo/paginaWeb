<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Editar producto</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/buttons.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main id="contenido-principal" class="ce-principal">
      <section class="ce-contenedor">
        <h1 class="ce-titulo-pagina">Editar producto</h1>
        <form class="ce-tarjeta" action="#" method="post">
          <label for="codigo">Código</label
          ><input id="codigo" value="MAT-001" readonly /><label for="nombre"
            >Nombre</label
          ><input
            id="nombre"
            maxlength="100"
            value="Cuaderno universitario"
            required
          /><label for="descripcion">Descripción</label
          ><textarea id="descripcion" maxlength="500"></textarea
          ><label for="precio">Precio</label
          ><input
            id="precio"
            type="number"
            min="0"
            step="0.01"
            required
          /><label for="stock">Stock</label
          ><input id="stock" type="number" min="0" required /><label
            for="categoria"
            >Categoría</label
          ><select id="categoria" required>
            <option value="">Selecciona una categoría</option>
            <option>Materiales</option>
            <option>Matemática</option></select
          ><button class="btn-ce btn-ce--primario" type="submit">
            Guardar producto</button
          ><a class="btn-ce btn-ce--secundario" href="productos.html"
            >Cancelar</a
          >
        </form>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
