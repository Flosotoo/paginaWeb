<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Crear usuario</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/buttons.css" />
    <link rel="stylesheet" href="../../assets/css/forms.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main id="contenido-principal" class="ce-principal">
      <section class="ce-contenedor">
        <h1 class="ce-titulo-pagina">Crear usuario</h1>
        <p class="ce-bajada">
          Alta de apoderados (Cliente) y de personal (Administrador o Vendedor).
          La contraseña se genera automáticamente y se envía al correo
          registrado.
        </p>

        <!-- HU10 y HU39: alta sin campo de contraseña; se genera una temporal -->
        <form
          class="ce-panel ce-panel--ancho"
          id="formUsuario"
          action="#"
          method="post"
        >
          <p
            id="usuario-aviso"
            class="ce-aviso"
            role="status"
            aria-live="polite"
            hidden
          ></p>

          <div class="ce-campo">
            <label for="usuario-run"
              >RUN
              <span class="ce-obligatorio" aria-hidden="true">*</span></label
            >
            <input
              id="usuario-run"
              name="run"
              class="ce-control ce-control--dato"
              maxlength="14"
              required
              placeholder="12.345.678-5"
            />
            <span class="ce-ayuda"
              >Con o sin puntos, guion y dígito verificador.</span
            >
            <span class="ce-error" id="error-usuario-run" role="alert"></span>
          </div>

          <div class="ce-campos-par">
            <div class="ce-campo">
              <label for="usuario-nombre"
                >Nombre
                <span class="ce-obligatorio" aria-hidden="true">*</span></label
              >
              <input
                id="usuario-nombre"
                name="nombre"
                class="ce-control"
                maxlength="50"
                required
              />
              <span class="ce-ayuda">Máximo 50 caracteres.</span>
              <span class="ce-error" id="error-usuario-nombre" role="alert"></span>
            </div>
            <div class="ce-campo">
              <label for="usuario-apellidos"
                >Apellidos
                <span class="ce-obligatorio" aria-hidden="true">*</span></label
              >
              <input
                id="usuario-apellidos"
                name="apellidos"
                class="ce-control"
                maxlength="100"
                required
              />
              <span class="ce-ayuda">Máximo 100 caracteres.</span>
              <span class="ce-error" id="error-usuario-apellidos" role="alert"></span>
            </div>
          </div>

          <div class="ce-campos-par">
            <div class="ce-campo">
              <label for="usuario-correo"
                >Correo
                <span class="ce-obligatorio" aria-hidden="true">*</span></label
              >
              <input
                id="usuario-correo"
                name="correo"
                type="email"
                class="ce-control"
                maxlength="100"
                required
              />
              <span class="ce-error" id="error-usuario-correo" role="alert"></span>
            </div>
            <div class="ce-campo">
              <label for="usuario-nacimiento">Fecha de nacimiento</label>
              <input
                id="usuario-nacimiento"
                name="nacimiento"
                type="date"
                class="ce-control ce-control--dato"
              />
              <span class="ce-ayuda">Opcional.</span>
              <span class="ce-error" id="error-usuario-nacimiento" role="alert"></span>
            </div>
          </div>

          <div class="ce-campo">
            <label for="usuario-tipo"
              >Tipo de usuario
              <span class="ce-obligatorio" aria-hidden="true">*</span></label
            >
            <select id="usuario-tipo" name="tipo" class="ce-control" required>
              <option value="">Selecciona un perfil</option>
              <option>Administrador</option>
              <option>Cliente</option>
              <option>Vendedor</option>
            </select>
            <span class="ce-error" id="error-usuario-tipo" role="alert"></span>
          </div>

          <div class="ce-campos-par">
            <div class="ce-campo">
              <label for="usuario-region"
                >Región
                <span class="ce-obligatorio" aria-hidden="true">*</span></label
              >
              <select id="usuario-region" name="region" class="ce-control" required>
                <option value="">Elige una región</option>
              </select>
              <span class="ce-error" id="error-usuario-region" role="alert"></span>
            </div>
            <div class="ce-campo">
              <label for="usuario-comuna"
                >Comuna
                <span class="ce-obligatorio" aria-hidden="true">*</span></label
              >
              <select
                id="usuario-comuna"
                name="comuna"
                class="ce-control"
                required
                disabled
              >
                <option value="">Elige primero una región</option>
              </select>
              <span class="ce-error" id="error-usuario-comuna" role="alert"></span>
            </div>
          </div>

          <div class="ce-campo">
            <label for="usuario-direccion"
              >Dirección
              <span class="ce-obligatorio" aria-hidden="true">*</span></label
            >
            <textarea
              id="usuario-direccion"
              name="direccion"
              class="ce-control"
              rows="2"
              maxlength="300"
              required
            ></textarea>
            <span class="ce-ayuda">Máximo 300 caracteres.</span>
            <span class="ce-error" id="error-usuario-direccion" role="alert"></span>
          </div>

          <div class="ce-formulario__acciones">
            <button class="btn-ce btn-ce--primario" type="submit">
              Guardar usuario
            </button>
            <a class="btn-ce btn-ce--secundario" href="usuarios.html"
              >Cancelar</a
            >
          </div>
        </form>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/validaciones.js"></script>
    <script src="../../assets/js/usuario.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
