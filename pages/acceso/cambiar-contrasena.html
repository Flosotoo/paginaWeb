<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Cambiar contraseña</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/buttons.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main id="contenido-principal" class="ce-principal">
      <section class="ce-contenedor">
        <h1 class="ce-titulo-pagina">Cambiar contraseña</h1>
        <form class="ce-tarjeta" action="#" method="post">
          <label for="actual">Contraseña temporal</label
          ><input
            id="actual"
            type="password"
            minlength="4"
            maxlength="10"
            required
          /><label for="nueva">Nueva contraseña</label
          ><input
            id="nueva"
            type="password"
            minlength="4"
            maxlength="10"
            required
          /><label for="confirmacion">Confirmar nueva contraseña</label
          ><input
            id="confirmacion"
            type="password"
            minlength="4"
            maxlength="10"
            required
          /><button class="btn-ce btn-ce--primario" type="submit">
            Guardar contraseña
          </button>
        </form>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
