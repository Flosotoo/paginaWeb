<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Cambiar contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/buttons.css" />
    <link rel="stylesheet" href="../../assets/css/forms.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main id="contenido-principal" class="ce-principal">
      <div class="ce-contenedor">
        <section class="ce-tarjeta ce-panel" aria-labelledby="titulo-cambio">
          <h1 id="titulo-cambio" class="ce-titulo-pagina">Cambiar contraseña</h1>
          <p class="ce-bajada">
            Define una nueva contraseña para continuar usando tu cuenta.
          </p>
          <p
            id="cambio-aviso"
            class="ce-aviso"
            role="status"
            aria-live="polite"
            hidden
          ></p>
          <form class="ce-formulario" id="formCambio" action="#" method="post">
            <div class="ce-campo">
              <label for="actual">Contraseña temporal</label>
              <input
                id="actual"
                name="actual"
                class="ce-control"
                type="password"
                minlength="4"
                maxlength="10"
                autocomplete="current-password"
                required
              />
              <span class="ce-ayuda">Entre 4 y 10 caracteres.</span>
              <span class="ce-error" id="error-actual" role="alert"></span>
            </div>
            <div class="ce-campo">
              <label for="nueva">Nueva contraseña</label>
              <input
                id="nueva"
                name="nueva"
                class="ce-control"
                type="password"
                minlength="4"
                maxlength="10"
                autocomplete="new-password"
                required
              />
              <span class="ce-ayuda">Entre 4 y 10 caracteres, distinta a la temporal.</span>
              <span class="ce-error" id="error-nueva" role="alert"></span>
            </div>
            <div class="ce-campo">
              <label for="confirmacion">Confirmar nueva contraseña</label>
              <input
                id="confirmacion"
                name="confirmacion"
                class="ce-control"
                type="password"
                minlength="4"
                maxlength="10"
                autocomplete="new-password"
                required
              />
              <span class="ce-ayuda">Debe coincidir con la nueva contraseña.</span>
              <span class="ce-error" id="error-confirmacion" role="alert"></span>
            </div>
            <div class="ce-formulario__acciones">
              <button class="btn-ce btn-ce--primario btn-ce--ancho" type="submit">
                Guardar contraseña
              </button>
              <a class="btn-ce btn-ce--secundario btn-ce--ancho" href="login.html">
                Volver al inicio de sesión
              </a>
            </div>
          </form>
        </section>
      </div>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/validaciones.js"></script>
    <script src="../../assets/js/validaciones-acceso.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
