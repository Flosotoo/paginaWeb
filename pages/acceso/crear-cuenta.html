<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Crear cuenta</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div id="header-container" class="sticky-top"></div>

    <main id="contenido-principal" class="flex-grow-1 pt-5 pb-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-7">
            <section class="card card-body" aria-labelledby="titulo-registro">
              <h1 id="titulo-registro" class="h1 mb-3">Crear cuenta</h1>
              <p class="lead mb-4">
                Regístrate como apoderado para aportar saldo con Webpay, revisar los
                movimientos de tus alumnos y reservar materiales en la librería escolar.
              </p>
              <p
                id="registro-aviso"
                class="alert"
                role="status"
                aria-live="polite"
                hidden
              ></p>

              <form id="formRegistro" action="#" method="post">
                <div class="mb-3">
                  <label for="registro-run" class="form-label"
                    >RUN
                    <span class="text-danger" aria-hidden="true">*</span></label
                  >
                  <input
                    id="registro-run"
                    name="run"
                    class="form-control font-monospace"
                    maxlength="14"
                    required
                    placeholder="12.345.678-5"
                  />
                  <span class="form-text"
                    >Con o sin puntos, guion y dígito verificador.</span
                  >
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-sm-6">
                    <label for="registro-nombre" class="form-label"
                      >Nombre
                      <span class="text-danger" aria-hidden="true">*</span></label
                    >
                    <input
                      id="registro-nombre"
                      name="nombre"
                      class="form-control"
                      maxlength="50"
                      autocomplete="given-name"
                      required
                    />
                  </div>
                  <div class="col-sm-6">
                    <label for="registro-apellidos" class="form-label"
                      >Apellidos
                      <span class="text-danger" aria-hidden="true">*</span></label
                    >
                    <input
                      id="registro-apellidos"
                      name="apellidos"
                      class="form-control"
                      maxlength="100"
                      autocomplete="family-name"
                      required
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label for="registro-correo" class="form-label"
                    >Correo electrónico
                    <span class="text-danger" aria-hidden="true">*</span></label
                  >
                  <input
                    id="registro-correo"
                    name="correo"
                    type="email"
                    class="form-control"
                    maxlength="100"
                    autocomplete="email"
                    placeholder="nombre@correo.cl"
                    required
                  />
                  <span class="form-text">Lo usarás para iniciar sesión.</span>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-sm-6">
                    <label for="registro-region" class="form-label"
                      >Región
                      <span class="text-danger" aria-hidden="true">*</span></label
                    >
                    <select
                      id="registro-region"
                      name="region"
                      class="form-select"
                      required
                    >
                      <option value="">Elige una región</option>
                    </select>
                  </div>
                  <div class="col-sm-6">
                    <label for="registro-comuna" class="form-label"
                      >Comuna
                      <span class="text-danger" aria-hidden="true">*</span></label
                    >
                    <select
                      id="registro-comuna"
                      name="comuna"
                      class="form-select"
                      required
                      disabled
                    >
                      <option value="">Elige primero una región</option>
                    </select>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="registro-direccion" class="form-label"
                    >Dirección
                    <span class="text-danger" aria-hidden="true">*</span></label
                  >
                  <input
                    id="registro-direccion"
                    name="direccion"
                    class="form-control"
                    maxlength="300"
                    autocomplete="street-address"
                    required
                  />
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-sm-6">
                    <label for="registro-clave" class="form-label"
                      >Contraseña
                      <span class="text-danger" aria-hidden="true">*</span></label
                    >
                    <input
                      id="registro-clave"
                      name="clave"
                      type="password"
                      class="form-control"
                      minlength="4"
                      maxlength="10"
                      autocomplete="new-password"
                      required
                    />
                    <span class="form-text">Entre 4 y 10 caracteres.</span>
                  </div>
                  <div class="col-sm-6">
                    <label for="registro-confirmacion" class="form-label"
                      >Confirmar contraseña
                      <span class="text-danger" aria-hidden="true">*</span></label
                    >
                    <input
                      id="registro-confirmacion"
                      name="confirmacion"
                      type="password"
                      class="form-control"
                      minlength="4"
                      maxlength="10"
                      autocomplete="new-password"
                      required
                    />
                  </div>
                </div>

                <div class="form-check mb-3">
                  <input
                    id="registro-consentimiento"
                    name="consentimiento"
                    class="form-check-input"
                    type="checkbox"
                    required
                  />
                  <label for="registro-consentimiento" class="form-check-label">
                    Acepto el tratamiento de mis datos personales y los de mis
                    alumnos según el aviso de privacidad.
                  </label>
                </div>

                <div class="d-flex flex-wrap gap-2 mt-4">
                  <button class="btn btn-primary w-100" type="submit">
                    Crear cuenta
                  </button>
                </div>
              </form>

              <p class="border-top pt-3 mt-4 text-center small text-body-secondary">
                ¿Ya tienes cuenta?
                <a class="link-primary link-offset-2" href="login.html">Iniciar sesión</a>
              </p>
            </section>
          </div>
        </div>
      </div>
    </main>

    <div id="footer-container"></div>

    <script src="../../assets/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/validaciones.js"></script>
    <script src="../../assets/js/validaciones-acceso.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
