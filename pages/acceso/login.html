<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Iniciar sesión</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/buttons.css" />
    <link rel="stylesheet" href="../../assets/css/forms.css" />
  </head>
  <body>
    <div id="header-container"></div>

    <main id="contenido-principal" class="ce-principal">
      <div class="ce-contenedor">
        <section class="ce-panel" aria-labelledby="titulo-login">
          <h1 id="titulo-login" class="ce-panel__titulo">Iniciar sesión</h1>
          <p class="ce-panel__bajada">
            Entra con el correo que registraste en el establecimiento.
          </p>
          <p
            class="ce-aviso ce-aviso--error"
            id="aviso-credenciales"
            role="alert"
            hidden
          >
            El correo o la contraseña no son correctos.
          </p>

          <form action="#" method="post" class="ce-formulario">
            <div class="ce-campo">
              <label for="correo">
                Correo electrónico
                <span class="ce-obligatorio" aria-hidden="true">*</span>
              </label>
              <input
                type="email"
                id="correo"
                name="correo"
                class="ce-control"
                maxlength="100"
                required
                autocomplete="email"
                placeholder="nombre@gmail.com"
                pattern="[^@\s]+@(duoc\.cl|profesor\.duoc\.cl|gmail\.com)"
              />
              <span class="ce-ayuda">
                Solo se aceptan los dominios duoc.cl, profesor.duoc.cl y
                gmail.com.
              </span>
              <span class="ce-error" id="error-correo" role="alert"></span>
            </div>

            <div class="ce-campo">
              <label for="clave">
                Contraseña
                <span class="ce-obligatorio" aria-hidden="true">*</span>
              </label>
              <input
                type="password"
                id="clave"
                name="clave"
                class="ce-control"
                minlength="4"
                maxlength="10"
                required
                autocomplete="current-password"
              />
              <span class="ce-ayuda">Entre 4 y 10 caracteres.</span>
              <span class="ce-error" id="error-clave" role="alert"></span>
            </div>

            <div class="ce-formulario__acciones">
              <button
                type="submit"
                class="btn-ce btn-ce--primario btn-ce--ancho"
              >
                Entrar
              </button>
            </div>
          </form>

          <p class="ce-panel__pie">
            ¿Todavía no tienes cuenta?
            <a href="registro.html" class="btn-ce btn-ce--texto"
              >Crear una cuenta</a
            >
            <br />
            <a href="cambiar-contrasena.html">Cambiar contraseña</a>
          </p>
        </section>
      </div>
    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
