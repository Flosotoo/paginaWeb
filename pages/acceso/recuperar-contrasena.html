<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Recuperar contraseña</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div id="header-container" class="sticky-top"></div>

    <main id="contenido-principal" class="flex-grow-1 pt-5 pb-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-8 col-lg-5">
            <section class="card card-body" aria-labelledby="titulo-recuperar">
              <h1 id="titulo-recuperar" class="h1 mb-3">
                ¿Olvidaste la contraseña?
              </h1>
              <p class="lead mb-4">
                Ingresa el correo de tu cuenta y te enviaremos una contraseña
                temporal para volver a entrar.
              </p>
              <p
                id="recuperar-aviso"
                class="alert"
                role="status"
                aria-live="polite"
                hidden
              ></p>

              <form id="formRecuperar" action="#" method="post">
                <div class="mb-3">
                  <label for="recuperar-correo" class="form-label">
                    Correo electrónico
                    <span class="text-danger" aria-hidden="true">*</span>
                  </label>
                  <input
                    id="recuperar-correo"
                    name="correo"
                    type="email"
                    class="form-control"
                    maxlength="100"
                    autocomplete="email"
                    placeholder="nombre@correo.cl"
                    required
                  />
                </div>

                <div class="d-flex flex-wrap gap-2 mt-4">
                  <button class="btn btn-primary w-100" type="submit">
                    Enviar contraseña temporal
                  </button>
                </div>
              </form>

              <p class="border-top pt-3 mt-4 text-center small text-body-secondary">
                ¿La recordaste?
                <a class="link-primary link-offset-2" href="login.html">Volver a iniciar sesión</a>
              </p>
            </section>
          </div>
        </div>
      </div>
    </main>

    <div id="footer-container"></div>

    <script src="../../assets/js/app.js"></script>
    <script src="../../assets/js/buscador.js"></script>
    <script src="../../assets/js/logs.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/validaciones.js"></script>
    <script src="../../assets/js/validaciones-acceso.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
