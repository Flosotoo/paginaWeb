<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Registrar compra</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/buttons.css" />
    <link rel="stylesheet" href="../../assets/css/forms.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main id="contenido-principal" class="ce-principal">
      <section class="ce-contenedor">
        <h1 class="ce-titulo-pagina">Registrar compra</h1>
        <p class="ce-bajada">
          Registra una compra presencial descontando el saldo del estudiante.
        </p>

        <p
          id="compra-aviso"
          class="ce-aviso"
          role="status"
          aria-live="polite"
          hidden
        ></p>

        <!-- HU52: la compra descuenta saldo y stock; HU53: rechazo por saldo corto -->
        <form
          class="ce-panel ce-panel--ancho"
          id="formCompra"
          action="#"
          method="post"
        >
          <div class="ce-campo">
            <label for="compra-estudiante"
              >Estudiante
              <span class="ce-obligatorio" aria-hidden="true">*</span></label
            >
            <input
              id="compra-estudiante"
              name="estudiante"
              class="ce-control"
              required
            />
            <span class="ce-error" id="error-compra-estudiante" role="alert"></span>
          </div>

          <div class="ce-campo">
            <label for="compra-producto"
              >Producto
              <span class="ce-obligatorio" aria-hidden="true">*</span></label
            >
            <select
              id="compra-producto"
              name="producto"
              class="ce-control"
              required
            >
              <option value="">Selecciona un producto</option>
            </select>
            <span class="ce-error" id="error-compra-producto" role="alert"></span>
          </div>

          <div class="ce-campo">
            <label for="compra-cantidad"
              >Cantidad
              <span class="ce-obligatorio" aria-hidden="true">*</span></label
            >
            <input
              id="compra-cantidad"
              name="cantidad"
              class="ce-control ce-control--dato"
              type="number"
              min="1"
              step="1"
              value="1"
              required
            />
            <span class="ce-error" id="error-compra-cantidad" role="alert"></span>
          </div>

          <dl class="ce-datos">
            <dt class="ce-etiqueta">Total de la compra</dt>
            <dd><strong id="compra-total">$0</strong></dd>
            <dt class="ce-etiqueta">Saldo disponible</dt>
            <dd><strong id="compra-saldo">$0</strong></dd>
          </dl>

          <div class="ce-formulario__acciones">
            <button class="btn-ce btn-ce--primario" type="submit">
              Confirmar compra
            </button>
          </div>
        </form>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="../../assets/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
    <script src="../../assets/js/validaciones.js"></script>
    <script src="../../assets/js/compra.js"></script>
  </body>
</html>
