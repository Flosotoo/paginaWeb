<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Registrar compra</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div id="header-container" class="sticky-top"></div>
    <main id="contenido-principal" class="flex-grow-1 pt-5 pb-5">
      <section class="container">
        <h1 class="h1 mb-3">Registrar compra</h1>
        <p class="lead mb-4">
          Registra una compra presencial descontando el saldo del estudiante.
        </p>

        <p
          id="compra-aviso"
          class="alert"
          role="status"
          aria-live="polite"
          hidden
        ></p>

        <!-- HU52: la compra descuenta saldo y stock; HU53: rechazo por saldo corto -->
        <div class="row justify-content-center">
          <div class="col-lg-7">
          <form
            class="card card-body"
            id="formCompra"
            action="#"
            method="post"
          >
            <div class="mb-3">
              <label for="compra-estudiante" class="form-label"
                >Estudiante
                <span class="text-danger" aria-hidden="true">*</span></label
              >
              <input
                id="compra-estudiante"
                name="estudiante"
                class="form-control"
                placeholder="Busca por nombre, curso o RUT"
                autocomplete="off"
                role="combobox"
                aria-expanded="false"
                aria-controls="resultados-estudiante"
                required
              />
              <div class="list-group mt-1" id="resultados-estudiante" hidden></div>
              <span class="form-text" id="compra-estudiante-resumen"></span>
              <span class="invalid-feedback" id="error-compra-estudiante" role="alert"></span>
            </div>
  
            <div class="mb-3">
              <label for="compra-producto" class="form-label"
                >Producto
                <span class="text-danger" aria-hidden="true">*</span></label
              >
              <select
                id="compra-producto"
                name="producto"
                class="form-select"
                required
              >
                <option value="">Selecciona un producto</option>
              </select>
              <span class="invalid-feedback" id="error-compra-producto" role="alert"></span>
            </div>
  
            <div class="mb-3">
              <label for="compra-cantidad" class="form-label"
                >Cantidad
                <span class="text-danger" aria-hidden="true">*</span></label
              >
              <input
                id="compra-cantidad"
                name="cantidad"
                class="form-control font-monospace"
                type="number"
                min="1"
                step="1"
                value="1"
                required
              />
              <span class="invalid-feedback" id="error-compra-cantidad" role="alert"></span>
            </div>
  
            <dl class="mb-3">
              <dt><span class="badge rounded-pill">Total de la compra</span></dt>
              <dd><strong id="compra-total">$0</strong></dd>
              <dt><span class="badge rounded-pill">Saldo disponible</span></dt>
              <dd><strong id="compra-saldo">$0</strong></dd>
            </dl>
  
            <div class="d-flex flex-wrap gap-2 mt-4">
              <button class="btn btn-primary" type="submit">
                Confirmar compra
              </button>
            </div>
          </form>
          </div>
        </div>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="../../assets/js/app.js"></script>
    <script src="../../assets/js/buscador.js"></script>
    <script src="../../assets/js/logs.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
    <script src="../../assets/js/validaciones.js"></script>
    <script src="../../assets/js/compra.js"></script>
  </body>
</html>
