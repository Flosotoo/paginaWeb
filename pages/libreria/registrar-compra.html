<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Registrar compra</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/buttons.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main id="contenido-principal" class="ce-principal">
      <section class="ce-contenedor">
        <h1 class="ce-titulo-pagina">Registrar compra</h1>
        <form class="ce-tarjeta" action="#" method="post">
          <label for="estudiante">Estudiante</label
          ><input id="estudiante" required /><label for="producto"
            >Producto</label
          ><select id="producto" required>
            <option value="">Selecciona un producto</option>
            <option>Cuaderno universitario · $3.490</option>
            <option>Set de geometría · $4.990</option></select
          ><label for="cantidad">Cantidad</label
          ><input id="cantidad" type="number" min="1" value="1" required />
          <p>Total estimado de la compra: <strong>$3.490</strong></p>
          <p>Saldo disponible del estudiante: $21.510</p>
          <button class="btn-ce btn-ce--primario" type="submit">
            Confirmar compra
          </button>
        </form>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
