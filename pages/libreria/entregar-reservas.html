<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Entregar reservas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div id="header-container" class="sticky-top"></div>
    <main id="contenido-principal" class="flex-grow-1 pt-5 pb-5">
      <section class="container">
        <h1 class="h1 mb-3">Entregar reservas</h1>
        <!-- HU36: validar el código y confirmar el retiro -->
        <form class="card card-body mb-4" id="formEntrega" action="#" method="post">
          <div class="mb-3">
            <label for="codigo" class="form-label">Código de reserva</label>
            <input
              id="codigo"
              name="codigo"
              class="form-control font-monospace"
              pattern="ED-[0-9]{4}-[0-9]{3}"
              placeholder="ED-2026-014"
              required
            />
            <span class="form-text">Formato ED-AAAA-NNN.</span>
          </div>
          <p
            id="entrega-aviso"
            class="alert"
            role="status"
            aria-live="polite"
            hidden
          ></p>
          <div class="d-flex flex-wrap align-items-center gap-3 mt-4">
            <button class="btn btn-primary" type="submit">
              Validar reserva
            </button>
          </div>
        </form>
        <div id="lista-entregar-reservas"></div>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="../../assets/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/validaciones.js"></script>
    <script src="../../assets/js/reserva.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
