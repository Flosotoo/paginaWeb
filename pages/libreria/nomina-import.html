<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Importar nómina</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/buttons.css" />
    <link rel="stylesheet" href="../../assets/css/forms.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main id="contenido-principal" class="ce-principal">
      <section class="ce-contenedor">
        <h1 class="ce-titulo-pagina">Importar nómina</h1>
        <form class="ce-tarjeta" action="#" method="post">
          <div class="ce-campo">
            <label for="archivo">Archivo CSV o XLSX</label>
            <input
              id="archivo"
              name="archivo"
              class="ce-control"
              type="file"
              accept=".csv,.xlsx"
              required
            />
            <span class="ce-ayuda">Debe incluir nombre, apellido, curso e identificador.</span>
          </div>
          <div class="ce-acciones">
            <button class="btn-ce btn-ce--primario" type="submit">
              Previsualizar nómina
            </button>
          </div>
        </form>
        <article class="ce-tarjeta">
          <h2 class="ce-subtitulo">Formato esperado</h2>
          <p>El archivo debe incluir nombre, apellido, curso e identificador del estudiante.</p>
        </article>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
