<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Importar nómina</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div id="header-container" class="sticky-top"></div>
    <main id="contenido-principal" class="flex-grow-1 pt-5 pb-5">
      <section class="container">
        <h1 class="h1 mb-3">Importar nómina</h1>
        <!-- HU43: previsualización y validación del archivo antes de importar -->
        <form class="card card-body mb-4" id="formNomina" action="#" method="post">
          <div class="mb-3">
            <label for="nomina-archivo" class="form-label">Archivo CSV o XLSX</label>
            <input
              id="nomina-archivo"
              name="archivo"
              class="form-control"
              type="file"
              accept=".csv,.xlsx"
              required
            />
            <span class="form-text"
              >CSV con columnas: nombre, apellido, curso, identificador
              (opcional).</span
            >
          </div>
          <p
            id="nomina-aviso"
            class="alert"
            role="status"
            aria-live="polite"
            hidden
          ></p>
          <div class="d-flex flex-wrap align-items-center gap-3 mt-4">
            <button class="btn btn-primary" type="submit">
              Previsualizar nómina
            </button>
          </div>
        </form>
        <div id="nomina-preview"></div>
        <article class="card card-body mb-4">
          <h2 class="h3 mb-2">Formato esperado</h2>
          <p>
            El archivo debe incluir nombre, apellido, curso e identificador del
            estudiante. Si alguna fila es inválida, se rechaza el archivo
            completo.
          </p>
        </article>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="../../assets/js/app.js"></script>
    <script src="../../assets/js/buscador.js"></script>
    <script src="../../assets/js/logs.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/validaciones.js"></script>
    <script src="../../assets/js/estudiante.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
