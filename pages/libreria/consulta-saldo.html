<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Consulta de saldo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/buttons.css" />
    <link rel="stylesheet" href="../../assets/css/forms.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main id="contenido-principal" class="ce-principal">
      <section class="ce-contenedor">
        <h1 class="ce-titulo-pagina">Consultar saldo</h1>
        <form class="ce-tarjeta" action="#" method="get">
          <div class="ce-campo">
            <label for="estudiante">Nombre o identificador del estudiante</label>
            <input id="estudiante" name="estudiante" class="ce-control" required />
          </div>
          <div class="ce-acciones">
            <button class="btn-ce btn-ce--primario" type="submit">Buscar</button>
          </div>
        </form>
        <article class="ce-tarjeta">
          <h2 class="ce-subtitulo">Martín Pérez</h2>
          <p>
            Identificador: EST-001 · Saldo disponible: <strong>$21.510</strong>
          </p>
        </article>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
