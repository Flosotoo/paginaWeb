<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSaldo - Consulta de saldo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/typography.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div id="header-container" class="sticky-top"></div>
    <main id="contenido-principal" class="flex-grow-1 pt-5 pb-5">
      <section class="container">
        <h1 class="h1 mb-3">Consultar saldo</h1>
        <!-- HU51: búsqueda por nombre o identificador -->
        <form class="card card-body mb-4" id="formConsultaSaldo" action="#">
          <div class="mb-3">
            <label for="estudiante" class="form-label">Estudiante</label>
            <input
              id="estudiante"
              name="estudiante"
              class="form-control"
              placeholder="Busca por nombre, curso o RUT"
              autocomplete="off"
              role="combobox"
              aria-expanded="false"
              aria-controls="resultados-estudiante"
              required
            />
            <div class="list-group mt-1" id="resultados-estudiante" hidden></div>
            <span class="form-text">Prueba con: Martín Pérez o Sofía Pérez.</span>
          </div>
          <div class="d-flex flex-wrap align-items-center gap-3 mt-4">
            <button class="btn btn-primary" type="submit">Buscar</button>
          </div>
        </form>
        <div id="saldo-resultado" aria-live="polite"></div>
      </section>
    </main>
    <div id="footer-container"></div>
    <script src="../../assets/js/app.js"></script>
    <script src="../../assets/js/buscador.js"></script>
    <script src="../../assets/js/logs.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/validaciones.js"></script>
    <script src="../../assets/js/compra.js"></script>
    <script src="../../assets/js/header-footer.js"></script>
  </body>
</html>
