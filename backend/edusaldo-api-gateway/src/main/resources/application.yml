server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        - id: ms-auth-usuarios
          uri: http://localhost:8091
          predicates:
            - Path=/api/auth/**, /api/usuarios/**, /api/configuracion/**, /api/auditoria/**, /api/politica-acceso/**, /api/consentimiento/**

        - id: ms-alumnos-saldos
          uri: http://localhost:8092
          predicates:
            - Path=/api/saldos/**

        - id: ms-productos-inventario
          uri: http://localhost:8093
          predicates:
            - Path=/api/productos/**, /api/categorias/**, /api/inventario/**

        - id: ms-ventas-reservas
          uri: http://localhost:8094
          predicates:
            - Path=/api/reservas/**, /api/entregas/**, /api/devoluciones/**, /api/operaciones/**
