server:
  port: 8094

spring:
  application:
    name: ms-ventas-reservas
  datasource:
    url: jdbc:mysql://${EDUSALDO_DB_HOST:127.0.0.1}:${EDUSALDO_DB_PORT:3306}/db_reservas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${EDUSALDO_DB_USER:root}
    password: ${EDUSALDO_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

edusaldo:
  internal:
    key: ${EDUSALDO_INTERNAL_KEY:edusaldo-local-dev-internal-key-change-in-production-2026}
  allowed-origins: ${EDUSALDO_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  gateway-url: ${EDUSALDO_GATEWAY_URL:http://localhost:8090}
  swagger:
    public: ${EDUSALDO_SWAGGER_PUBLIC:true}
