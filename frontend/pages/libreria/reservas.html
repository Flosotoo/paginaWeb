<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reservas · EduSaldo</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body data-root="../../" data-role="libreria">
    <header class="site-header">
      <div class="header-inner">
        <a href="inicio.html" class="brand brand-light"
          ><span class="brand-mark">e<span>·</span></span
          ><span>edu<strong>saldo</strong><i>.</i></span></a
        ><button
          class="mobile-nav-toggle"
          type="button"
          aria-label="Abrir menú"
          aria-expanded="false"
          aria-controls="mobile-main-nav"
        >
          <span aria-hidden="true">☰</span
          ><span class="mobile-nav-label">Menú</span>
        </button>
        <nav
          id="mobile-main-nav"
          class="header-nav"
          aria-label="Módulo encargado"
        >
          <a href="inicio.html">Inicio</a><a href="reservas.html">Reservas</a
          ><a href="entrega-directa.html">Entrega directa</a
          ><a href="inventario.html">Inventario</a
          ><a href="recepcion-compras.html">Recepción compras</a
          ><a href="devoluciones.html">Devoluciones</a>
        </nav>
        <div class="header-account">
          <span class="user-bubble" data-initial></span
          ><span class="user-name" data-user></span
          ><button class="logout" id="logout" type="button">Salir ↗</button>
        </div>
      </div>
    </header>
    <main class="dashboard staff-dashboard">
      <a class="back-link" href="inicio.html">← Inicio del encargado</a>
      <section class="staff-panel">
        <span class="eyebrow">ÁREA DEL ENCARGADO</span>
        <h1>Reservas</h1>
        <p>Selecciona la tarea que necesitas realizar.</p>
        <div class="staff-grid staff-reserve-paths" id="reserve-paths">
          <button type="button" class="staff-tile" data-view="preparar">
            <span class="staff-symbol">▤</span>
            <h2>Reservas por preparar</h2>
            <p>Escanear artículos, completar bolsa y generar etiqueta.</p>
            <b>Abrir →</b></button
          ><button type="button" class="staff-tile peach" data-view="entregar">
            <span class="staff-symbol">▣</span>
            <h2>Reservas pendientes de entrega</h2>
            <p>Escanear bolsa y credencial del alumno para entregar.</p>
            <b>Abrir →</b></button
          ><button type="button" class="staff-tile sage" data-view="entregadas">
            <span class="staff-symbol">✓</span>
            <h2>Reservas entregadas</h2>
            <p>
              Consultar historial de retiros y detalle de materiales entregados.
            </p>
            <b>Abrir →</b>
          </button>
        </div>
        <div id="reserve-work" hidden>
          <button type="button" class="staff-small" id="reserve-back">
            ← Volver a Reservas
          </button>
          <h2 id="reserve-title"></h2>
          <div id="staff-reservations" class="staff-reservations"></div>
        </div>
        <div id="print-bag-label" aria-hidden="true"></div>
      </section>
    </main>
    <script src="../../assets/js/navigation.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script src="../../assets/js/messages.js"></script>
    <script src="../../assets/js/libreria.js"></script>
    <script src="../../assets/js/cierre-funcional.js"></script>
  </body>
</html>
